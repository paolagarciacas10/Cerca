        <!-- DASHBOARD -->
        <section id="dashboard" class="page active">
<div class="hero-row">
            <header>
				
                <h1>Find the right event at the right time!</h1>
				
		</header>
				<p>
                    Enter your location and find activities around you.
                </p>
				<header class="hero-header">

    
            </header>
				</div>
<nav class="bottom-nav" aria-label="Main navigation">

    <a href="dashboard.html" class="active">

			<a> </a>

            <form id="searchForm" action="Explore.html" method="get">

                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

         <input
    type="text"
    id="location"
    name="location"
    placeholder="Example: Nashville, TN"
    autocomplete="off"
    required
>
<div id="city-suggestions" role="listbox"></div>
                </div>


                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="time">
                        Time
                    </label>

                    <input
                        type="time"
                        id="time"
                        name="time"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        What do you want to do?
                    </label>

                    <select id="category" name="category">

                       <option value="food">Food</option>
<option value="coffee">Coffee &amp; Cafes</option>
<option value="nightlife">Nightlife</option>
<option value="entertainment">Entertainment</option>
<option value="shopping">Shopping</option>
<option value="outdoors">Outdoors</option>
<option value="attractions">Attractions</option>
<option value="museums">Museums</option>
<option value="sports">Sports &amp; Recreation</option>
<option value="wellness">Wellness &amp; Spa</option>

                    </select>

                </div>


                <button type="submit">
                    Find Activities
                </button>

            </form>

</section>
